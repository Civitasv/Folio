name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Report exact uncovered source lines and branches
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          if(existsSync('coverage/lcov.info')){
            const files=readFileSync('coverage/lcov.info','utf8').split('end_of_record');
            for(const file of files){
              const name=file.match(/^SF:(.*)$/m)?.[1];
              if(!name)continue;
              const missing=file.split('\n').filter(x=>
                /^DA:[0-9]+,[0]+(?:,|$)/.test(x)||
                /^BRDA:[0-9]+,[0-9]+,[0-9]+,(?:0|-)$/m.test(x)||
                /^FNDA:0,/.test(x));
              if(missing.length)console.log(name+' gaps: '+missing.join(' | '));
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: ignore
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      - run: cargo test --workspace
